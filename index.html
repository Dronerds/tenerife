<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" />
    <title>Tenerife</title>
    <style>
      html,
      body,
      #cesiumContainer {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e13;
      }
      canvas {
        display: block;
      }
      #loading {
        position: fixed;
        inset: 0;
        /* Above the HUD too — half-filled readouts undercut a loading screen. */
        z-index: 10;
        display: grid;
        place-items: center;
        background: #0b0e13;
        color: #cfe3ff;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        /* Faded out rather than removed, so the handover is not a hard cut. */
        transition: opacity 400ms ease;
      }
      #loading[hidden] {
        display: grid;
        opacity: 0;
        pointer-events: none;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #cfe3ff;
        background: rgba(6, 10, 16, 0.72);
        border: 1px solid rgba(120, 160, 210, 0.25);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="loading">loading…</div>
    <div id="hud">booting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
