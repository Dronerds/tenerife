name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release (generate notes, mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env rather than interpolated into the script below: these come from the
          # pushed git tag, and interpolation substitutes them into bash before the shell ever
          # treats them as data.
          TAG: ${{ steps.get_tag.outputs.tag }}
          VERSION: ${{ steps.get_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq .body > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          else
            gh release create "$TAG" \
              --title "Release ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi

  build:
    name: Build
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Plain `npm ci`, never --ignore-scripts: the postinstall hook stages
      # Cesium's runtime assets into public/cesium, which is gitignored and
      # which the build copies into dist. Without it the release bundle ships
      # without Cesium's workers and never renders.
      - run: npm ci

      # No VITE_CESIUM_ION_TOKEN in the downloadable archive. Vite inlines
      # VITE_* at build time, so a token here would ship inside a public tarball
      # with no way to rotate it out. Whoever unpacks this rebuilds with their
      # own; the deploy job below builds separately with ours.
      - run: npm run build

      - name: Package dist
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dronerds-tenerife-v${VERSION}-dist.tar.gz"
          tar czf "${ARCHIVE}" dist
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dronerds-tenerife-v${{ needs.create-release.outputs.version }}-dist.tar.gz
            dronerds-tenerife-v${{ needs.create-release.outputs.version }}-dist.tar.gz.sha256
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Plain `npm ci`, never --ignore-scripts: the postinstall hook stages
      # Cesium's runtime assets into the gitignored public/cesium, and without
      # them the deployed site never renders.
      - run: npm ci

      # A second build rather than the release tarball: that one is deliberately
      # tokenless for public download, and this one needs the token inlined.
      # The token is readable by anyone who loads the site — that is inherent to
      # a browser app talking to ion, and the mitigation is scoping it to this
      # domain in the ion dashboard, not hiding it.
      - run: npm run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}

      # Fail here rather than silently publishing a site that errors on load for
      # every visitor: an unset or empty secret is invisible until you open it.
      - name: Verify the token made it into the bundle
        env:
          TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "VITE_CESIUM_ION_TOKEN secret is empty or unset." >&2
            exit 1
          fi
          if ! grep -qrF "${TOKEN}" dist/assets; then
            echo "Token is not present in dist/assets — the build did not inline it." >&2
            exit 1
          fi

      # The site to deploy to is named in firebase.json rather than here, so the
      # mapping lives in git. projectId must match the Firebase project.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dronerds
          channelId: live

  upload:
    name: Upload
    needs: [create-release, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./dist/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
